<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pulse Diagnostics</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark;--bg:#050505;--side:#090909;--panel:#111111;--panel2:#171717;--line:#2a2a2a;--line-soft:#1d1d1d;--txt:#f2f2f2;--muted:#aaaaaa;--dim:#767676;--acc:#b7b7b7;--PASS:#bbbbbb;--WARN:#c3c3c3;--FAIL:#989898;--INFO:#b7b7b7;--SKIP:#7e7e7e;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0;overflow:hidden}
body{background:#030303;color:var(--txt);font-size:13px;line-height:1.5}
#root{padding:10px;background:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
svg{flex-shrink:0}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;width:100%;height:100%;min-width:940px;overflow:hidden;border-radius:24px;border:1px solid #252525;background:var(--bg);box-shadow:0 30px 80px #00000070,inset 0 1px 0 #ffffff08}
.side{width:254px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;padding:29px 15px 18px;gap:4px}
.brand{display:flex;align-items:center;gap:13px;padding:2px 9px 43px}
.brandmark{width:41px;height:41px;border:1px solid #555555;border-radius:12px;background:linear-gradient(145deg,#414141,#121212);color:#e3e3e3;display:grid;place-items:center;box-shadow:0 7px 24px rgba(255,255,255,.06)}
.brand strong{display:block;font-size:18px;letter-spacing:.19em;font-weight:800;line-height:1.3}
.brand small{display:block;color:var(--dim);font-size:8px;letter-spacing:.17em;white-space:nowrap;margin-top:5px}
.side-label{color:#747474;font-size:10px;letter-spacing:.18em;font-weight:700;margin:0 11px 10px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{width:100%;border:1px solid transparent;color:#b4b4b4;background:none;padding:13px 12px;border-radius:9px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:550;transition:background .15s,color .15s}
.nav button svg{color:#8e8e8e}
.nav button:hover{background:#1a1a1a;color:#ffffff}
.nav button.on{color:#f2f2f2;background:linear-gradient(100deg,#2f2f2f,#1b1b1b);border-color:#4f4f4f}
.nav button.on>svg{color:#dbdbdb}
.nav button.on:before{content:'';position:absolute;left:0;height:27px;width:3px;border-radius:0 4px 4px 0;background:#b7b7b7}
.nav-arrow{margin-left:auto;opacity:.7}
.side-info{border-radius:12px;background:linear-gradient(145deg,#1a1a1a,#111111);border:1px solid #303030;padding:17px 15px;margin-top:41px}
.side-info-title{display:flex;gap:9px;align-items:center;font-weight:650;font-size:12px}
.side-info-title svg{color:#d3d3d3}
.side-info p{color:var(--muted);font-size:11.5px;margin:10px 0 15px;line-height:1.65}
.version{font-size:9px;color:#858585;letter-spacing:.15em}
.spacer{flex:1}
.side-bottom{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line-soft);padding:19px 10px 6px}
.side-bottom strong{font-size:11px;display:block;color:#dadada}
.side-bottom small{font-size:10px;color:var(--dim);display:block}
.online-dot{width:10px;height:10px;border-radius:50%;background:var(--PASS);box-shadow:0 0 0 5px #bbbbbb15}
main{min-width:0;flex:1;display:flex;flex-direction:column}
.topbar{height:56px;min-height:56px;border-bottom:1px solid var(--line-soft);background:#090909;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 26px}
.top-left,.top-right{display:flex;align-items:center;gap:13px}
.top-left{color:#b6b6b6;font-size:12px}
.top-left svg{color:#7a7a7a}
.top-product{font-weight:750;letter-spacing:.13em;color:#f1f1f1}
.top-right{gap:12px}
.local-tag{display:flex;align-items:center;gap:7px;color:#a0a0a0;font-size:10px;font-weight:700;letter-spacing:.08em;padding:8px 12px;border-radius:999px;border:1px solid #353535;background:#111}
.local-tag svg{color:var(--PASS)}
.avatar{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;border:1px solid #4e4e4e;background:#252525;color:#d8d8d8;font-size:11px;font-weight:750}
.drag-region{-webkit-app-region:drag}
.no-drag,.no-drag *{-webkit-app-region:no-drag}
.win-controls{display:flex;align-items:center;gap:8px}
.win-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;border:1px solid #3d3d3d;background:#141414;color:#d8d8d8;transition:background .15s,border-color .15s,color .15s}
.win-btn:hover{background:#202020;border-color:#616161;color:#fff}
.win-btn.close:hover{background:#2a1717;border-color:#7b4b4b;color:#fff}
.scroll-area{overflow-y:auto;flex:1;padding:26px 28px 42px;background:radial-gradient(ellipse 60% 45% at 85% 0%,rgba(255,255,255,.06),transparent 75%),var(--bg)}
.page{display:none;max-width:1540px;margin:0 auto}
.page.on{display:block}
h1{font-size:29px;font-weight:730;letter-spacing:-.045em;margin:3px 0 5px}
.title-dot{color:#d3d3d3}
.eyebrow{font-size:10px;letter-spacing:.18em;color:#c1c1c1;font-weight:780}
.sub{margin:0;color:var(--muted);font-size:12.5px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
.live-indicator{border:1px solid #4c4c4c;background:#202020;color:#cccccc;font-size:10px;font-weight:760;letter-spacing:.1em;border-radius:99px;padding:8px 13px;display:flex;gap:9px;align-items:center;white-space:nowrap}
.live-indicator i{display:block;width:7px;height:7px;border-radius:50%;background:#bfbfbf;box-shadow:0 0 10px #bfbfbfaa}
.live-indicator small{font-size:10px;color:#979797;letter-spacing:0;border-left:1px solid #585858;padding-left:9px;font-weight:500}
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;box-shadow:0 10px 26px #00000012}
.hero{min-height:210px;position:relative;display:flex;justify-content:space-between;gap:22px;align-items:stretch;overflow:hidden;background:linear-gradient(115deg,#1a1a1a,#101010 66%,#282828);border-color:#3f3f3f;padding:26px 27px;margin-bottom:24px}
.hero-glow{position:absolute;width:390px;height:330px;right:-40px;top:-180px;border-radius:50%;background:radial-gradient(circle,#dadada1c,transparent 72%);pointer-events:none}
.hero-info{z-index:1;min-width:0;display:flex;flex-direction:column}
.hero-top{display:flex;align-items:center;gap:30px}
.hero-os{color:#b1b1b1;display:flex;align-items:center;gap:7px;font-size:11px}
.hero h2{font-size:28px;letter-spacing:-.035em;margin:12px 0 0;max-width:500px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero p{font-size:12px;color:#bcbcbc;margin:3px 0 18px;max-width:650px}
.hero-chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto}
.hero-chips span{display:flex;align-items:center;gap:7px;border-radius:6px;padding:6px 10px;font-size:10.5px;color:#cccccc;border:1px solid #3f3f3f;background:#181818d0}
.hero-chips svg{color:#d3d3d3}
.hero-status{z-index:1;flex:0 0 195px;border-left:1px solid #3d3d3d;padding-left:25px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.health-ring{width:96px;height:96px;position:relative}
.health-ring>div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.health-ring strong{font-size:13px;font-weight:770;letter-spacing:-.03em}
.health-ring small{font-size:8px;color:#b4b4b4;letter-spacing:.12em}
.status-caption{text-align:center;margin-top:5px;font-size:11px;color:#cacaca}
.status-caption small{display:block;font-size:10px;color:#949494;margin-top:2px}
.notice{margin:-8px 0 22px;border:1px solid #525252;background:#272727;border-radius:9px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:11.5px;color:#cacaca;overflow-wrap:anywhere}
.notice svg{color:#cccccc}
.notice b{font-weight:740;color:#e4e4e4}
.section-row{margin:22px 0 14px;display:flex;justify-content:space-between;align-items:center}
.section-row h2{font-size:16px;font-weight:700;margin:0}
.section-row p{font-size:11px;color:var(--muted);margin:3px 0 0}
.section-meta{font-size:10px;letter-spacing:.10em;color:#8e8e8e;font-weight:680}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.metric{padding:17px 18px 14px;min-width:0;min-height:181px;overflow:hidden;transition:border-color .2s,transform .2s}
.metric:hover{border-color:#4f4f4f;transform:translateY(-2px)}
.metric-head{display:flex;align-items:center;gap:9px;min-width:0}
.metric-icon{width:29px;height:29px;border-radius:8px;background:#262626;color:#dbdbdb;display:grid;place-items:center}
.metric-name{font-size:9px;font-weight:750;color:#b3b3b3;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-extra{margin-left:auto;font-size:9px;color:#7b7b7b;border:1px solid #3f3f3f;border-radius:4px;padding:1px 4px}
.metric-value{font-variant-numeric:tabular-nums;font-size:27px;font-weight:760;letter-spacing:-.05em;color:#f4f4f4;line-height:1.2;margin:13px 0 5px;min-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-value>span{font-size:14px;font-weight:580;color:#a4a4a4;letter-spacing:0;margin-left:4px}
.metric-sub{font-size:10.5px;color:#929292;min-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{display:block;width:100%;height:44px;margin-top:10px}
.bottom-grid{margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.detail-card{padding:18px 21px 15px}
.card-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:720;margin-bottom:10px}
.card-title svg{color:#d3d3d3}
.detail-line{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;border-top:1px solid var(--line-soft);padding:10px 0;font-size:11px}
.detail-line span{color:#9f9f9f;flex-shrink:0}
.detail-line strong{font-weight:550;color:#c9c9c9;text-align:right;max-width:65%;overflow-wrap:anywhere}
.sensor-head{display:flex;align-items:center;padding:20px 23px;gap:18px;background:linear-gradient(110deg,#171717,#101010);margin-bottom:19px}
.sensor-icon{width:48px;height:48px;background:#2a2a2a;border:1px solid #4b4b4b;color:#d0d0d0;display:grid;place-items:center;border-radius:12px}
.sensor-icon.good{background:#2d2d2d;border-color:#5a5a5a;color:#bfbfbf}
.sensor-head h2{font-size:15px;margin:0 0 4px}
.sensor-head p{font-size:11.5px;margin:0;color:#9f9f9f;word-break:break-word}
.sensor-total{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.sensor-total strong{font-size:26px;font-weight:740;letter-spacing:-.04em}
.sensor-total span{font-size:9px;letter-spacing:.13em;color:#8f8f8f}
.sensor-toolbar{display:flex;gap:12px;margin-bottom:15px}
.search{position:relative;flex:1}
.search svg{position:absolute;left:14px;top:11px;color:#7a7a7a}
.search input{padding-left:42px!important}
.sensor-toolbar select{width:205px}
.sensor-table{overflow:hidden}
.sensor-table-head,.sensor-row{display:grid;grid-template-columns:minmax(210px,1.7fr) minmax(110px,.8fr) minmax(120px,.65fr);gap:17px;align-items:center;padding:13px 21px}
.sensor-table-head{background:#191919;color:#9a9a9a;font-size:10px;font-weight:740;letter-spacing:.11em}
.sensor-row{border-top:1px solid var(--line-soft);min-height:61px}
.sensor-row:hover{background:#1a1a1a}
.sensor-row b{display:block;font-weight:610;color:#dedede;font-size:11.5px}
.sensor-row small{color:#909090;font-size:10.5px}
.sensor-kind{color:#a5a5a5;font-size:11px}
.sensor-value{text-align:right;font-variant-numeric:tabular-nums;color:#f1f1f1;font-size:14px;font-weight:730}
.sensor-value span{font-size:11px;color:#a4a4a4;margin-left:4px}
.disclaimer{color:#878787;font-size:11px;margin-top:17px}
.diag{display:grid;grid-template-columns:318px minmax(0,1fr);gap:19px;align-items:start}
.panel{padding:21px;position:sticky;top:0}
.lbl{font-size:10px;letter-spacing:.11em;color:#9f9f9f;font-weight:700;text-transform:uppercase}
.tchk{display:flex;align-items:flex-start;gap:11px;padding:11px;border:1px solid #2e2e2e;border-radius:9px;margin-bottom:7px;cursor:pointer;transition:.15s}
.tchk:hover{border-color:#5a5a5a;background:#1a1a1a}
.tchk:has(input:checked){border-color:#5a5a5a;background:#161616}
.tchk input{accent-color:var(--acc);margin:3px 0 0}
.tchk b{font-size:11.5px;display:block;font-weight:630;color:#e0e0e0}
.tchk span{font-size:10px;color:#939393;display:block;margin-top:2px}
.switch{display:flex;gap:10px;align-items:center;color:#c0c0c0;margin:15px 0}
.switch input{accent-color:var(--acc)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:15px 0 7px;color:#e5e5e5;font-size:11px}
.row2 .lbl{font-size:10px}
input[type=range]{width:100%;accent-color:#c4c4c4}
input[type=text],select,.search input{width:100%;outline:0;background:#0c0c0c;color:var(--txt);border:1px solid #323232;border-radius:9px;padding:10px 12px;font-size:11.5px}
input[type=text]:focus,select:focus,.search input:focus{border-color:#949494}
.inline{display:flex;gap:7px}
.btn{border-radius:9px;padding:10px 13px;border:1px solid #3a3a3a;color:#e6e6e6;background:#181818;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn:hover{background:#252525;border-color:#666666}
.btn.pri{background:linear-gradient(110deg,#d9d9d9,#949494);color:#080808;border-color:#bdbdbd;width:100%;font-weight:800;padding:12px;margin-top:18px}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{border-color:#4b4b4b;color:#bfbfbf;width:100%;margin-top:9px;display:flex!important}
.btn.secondary{background:#181818;color:#d2d2d2}
.progress{height:5px;background:#181818;border-radius:9px;overflow:hidden;margin:4px 0 15px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#bcbcbc,#d9d9d9);transition:width .3s}
.status{min-height:25px;color:#ababab;display:flex;align-items:flex-start;justify-content:space-between;font-size:11px;gap:8px;margin:0 0 13px}
.counts{display:flex;gap:10px;white-space:nowrap;font-size:10px}
.counts .PASS{color:var(--PASS)}
.counts .WARN{color:var(--WARN)}
.counts .FAIL{color:var(--FAIL)}
.empty{padding:45px 24px;text-align:center;color:#a1a1a1;font-size:12px;border:1px dashed #3a3a3a;border-radius:12px}
.verdict{display:block!important;padding:19px 21px;border-radius:12px;border:1px solid;margin-bottom:15px;background:var(--panel)}
.verdict h2{font-size:18px;margin:0}
.verdict p{font-size:12px;color:#afafaf;margin:4px 0}
.verdict ul{padding-left:19px;margin:13px 0;color:#c5c5c5;font-size:11px}
.acts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.sec{margin-bottom:14px;padding:18px 21px}
.sec h3{color:#d3d3d3;font-size:11px;letter-spacing:.11em;font-weight:740;margin:0 0 10px;text-transform:uppercase}
.r{border-top:1px solid #242424;padding:9px 0;display:grid;grid-template-columns:55px minmax(115px,200px) minmax(0,1fr);gap:11px;font-size:11px}
.r:first-of-type{border-top:0}
.r .n{color:#a2a2a2}
.r .v{color:#dddddd;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.r .v em{display:block;font-size:10px;color:#8e8e8e;font-style:normal}
.b{font-size:9px;letter-spacing:.05em;font-weight:780;align-self:start;padding:3px 6px;border:1px solid;border-radius:5px;text-align:center}
.PASS{color:var(--PASS)}
.WARN{color:var(--WARN)}
.FAIL{color:var(--FAIL)}
.INFO{color:var(--INFO)}
.SKIP{color:var(--SKIP)}
.log{padding:12px;margin-top:14px;height:150px;background:#0b0b0b;border-radius:12px;border:1px solid var(--line);font:10.5px/1.5 Consolas,monospace;color:#b4b4b4;overflow:auto;white-space:pre-wrap}
.toast{position:fixed;right:24px;bottom:20px;max-width:550px;padding:12px 17px;background:#1a1a1a;border:1px solid #4e4e4e;border-radius:10px;color:#eeeeee;font-size:11.5px;opacity:0;transform:translateY(12px);pointer-events:none;transition:all .23s;box-shadow:0 15px 55px #0008}
.toast.on{opacity:1;transform:none}
@media(max-width:1350px){.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{min-height:202px}.side{width:230px}.scroll-area{padding:28px 27px 40px}}
@media(max-width:1120px){.diag{grid-template-columns:1fr}.panel{position:static}.bottom-grid{grid-template-columns:1fr}.hero-status{flex-basis:155px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
:root{ --bg:#050505; --side:#080808; --panel:#111111; --panel2:#171717; --line:#303030; --line-soft:#242424; --txt:#f3f3f3; --muted:#a6a6a6; --dim:#7c7c7c; --acc:#bcbcbc; --INFO:#bcbcbc; }
body, .scroll-area{ background:#050505; }
.scroll-area{ background-image:linear-gradient(180deg,#0b0b0b 0%,#050505 25%); }
.side{ background:linear-gradient(180deg,#101010,#090909 22%,#070707); border-right-color:#2d2d2d; }
.topbar{ background:#0a0a0a; border-bottom:1px solid #292929; }
.brandmark{
  border:1px solid #7a7a7a;
  color:#f1f1f1;
  background:repeating-linear-gradient(0deg,transparent 0px,rgba(255,255,255,.025) 1px,transparent 2px,transparent 4px),linear-gradient(135deg,#585858,#1a1a1a 58%,#3d3d3d);
  box-shadow:inset 0 1px 0 #ffffff35,0 4px 15px #0009;
  border-radius:6px;
}
.nav button{ border-radius:5px; }
.nav button.on{ background:#232323; border:1px solid #515151; box-shadow:inset 0 1px 0 #ffffff0e; }
.nav button.on:before{ background:#cdcdcd; }
.side-info,.avatar{ background:#131313; border-color:#2e2e2e; border-radius:6px; }
.card{ border-radius:7px; background:linear-gradient(180deg,#151515,#111111); border:1px solid #303030; box-shadow:none; }
.hero{ border-color:#4a4a4a; background:repeating-linear-gradient(0deg,transparent 0px,rgba(255,255,255,.012) 1px,transparent 2px,transparent 6px),linear-gradient(105deg,#272727,#131313 45%,#212121); box-shadow:inset 0 1px 0 #ffffff15; }
.hero-glow{ background:radial-gradient(circle,#bebebe14,transparent 72%); }
.hero-chips span{ border:1px solid #4c4c4c; background:#151515; border-radius:3px; }
.metric{ position:relative; border-color:#303030; transition:background .18s,border-color .18s,transform .18s; }
.metric::before{ content:''; position:absolute; top:0; left:17px; right:17px; height:1px; background:linear-gradient(90deg,transparent,#9b9b9b55 50%,transparent); }
.metric:hover{ border-color:#777777; transform:translateY(-1px); background:linear-gradient(180deg,#1b1b1b,#121212); }
.metric-icon,.sensor-icon{ background:#262626; border:1px solid #3d3d3d; border-radius:5px; color:#d3d3d3; }
.sensor-head{ background:#161616; }
.sensor-icon.good{ background:#222222; color:#dadada; border-color:#6c6c6c; }
.metric-value{ color:#f4f4f4; }
.metric-sub{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.btn{ border-radius:5px; background:#1a1a1a; border-color:#464646; box-shadow:inset 0 1px 0 #ffffff0c; }
.btn.pri{ border-radius:5px; background:linear-gradient(180deg,#d8d8d8,#9c9c9c); border:1px solid #d3d3d3; color:#090909; box-shadow:inset 0 1px 0 #ffffff88; }
.btn:hover{ background:#2b2b2b; border-color:#7a7a7a; }
.btn.pri:hover{ background:linear-gradient(180deg,#f1f1f1,#bcbcbc); }
input[type=text],select,.search input{ border-radius:5px; background:#0b0b0b; border-color:#3e3e3e; }
.tchk{ border-radius:5px; }
.sensor-table-head{ background:#1f1f1f; }
.sensor-row:hover{ background:#1c1c1c; }
.live-indicator{ background:#191919; border:1px solid #505050; color:#cfcfcf; border-radius:5px; }
.live-indicator i{ box-shadow:0 0 0 3px #bbbbbb16; }
.sensor-alert{ display:flex; align-items:flex-start; gap:12px; border:1px solid #535353; border-left:3px solid #bdbdbd; background:#181818; color:#c6c6c6; padding:15px 16px; margin:0 0 18px; border-radius:5px; }
.sensor-alert>svg{ color:#e4e4e4; margin-top:2px; }

:root{
  color-scheme:dark;
  --bg:#000000; --side:#080808; --panel:#151515; --panel2:#1b1b1b;
  --line:#343434; --line-soft:#2a2a2a; --txt:#ffffff;
  --muted:#b7b7b7; --dim:#777777; --acc:#f5f5f5;
  --PASS:#d9d9d9; --WARN:#a0a0a0; --FAIL:#f0f0f0; --INFO:#bcbcbc; --SKIP:#777777;
  font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0;overflow:hidden}
body{font-size:13px;line-height:1.5;color:var(--txt);background:#000}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #c6c6c6;outline-offset:2px}
button:disabled{opacity:.52;cursor:not-allowed}
#app{width:100%;height:100%;min-width:0;display:flex;background:#000}
.side{width:255px;flex:0 0 255px;display:flex;flex-direction:column;gap:0;padding:0 15px 18px;background:linear-gradient(165deg,#111111 0%,#080808 25%,#050505 100%);border-right:1px solid #252525}
.brand{height:124px;padding:39px 15px 25px;display:flex;align-items:flex-start;margin:0;gap:0}
.brand strong{display:block;color:#fff;font-size:22px;font-weight:690;letter-spacing:.185em;line-height:1.12}
.brand small{display:block;margin-top:8px;color:#999;font-size:10px;font-weight:600;letter-spacing:.27em;line-height:1.25}
.side-label{margin:19px 13px 15px;color:#777;letter-spacing:.2em;font-size:10px;font-weight:650}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{position:relative;display:flex;align-items:center;gap:13px;width:100%;padding:14px 15px;border-radius:12px;color:#929292;background:transparent;border:1px solid transparent;font-weight:580;font-size:12.5px;transition:background .18s,border-color .18s,color .18s,box-shadow .18s}
.nav button svg{color:#888;transition:color .18s}
.nav button:hover{background:linear-gradient(115deg,#222,#151515);border-color:#292929;color:#eee}
.nav button.on{color:#fff;border-color:#505050;background:linear-gradient(115deg,#353535 0%,#262626 44%,#202020 100%);box-shadow:inset 0 1px 0 #ffffff19,0 4px 14px #0006}
.nav button.on svg{color:#fff}
.nav button.on:before{content:'';width:3px;height:24px;left:-15px;position:absolute;background:linear-gradient(#737373,#fff,#737373);border-radius:99px}
.nav-arrow{margin-left:auto;color:#999!important}
.side-info{margin-top:48px;padding:19px 17px 16px;border-radius:16px;border:1px solid #343434;background:linear-gradient(156deg,#202020,#111 70%);box-shadow:inset 0 1px 0 #ffffff13}
.side-info-title{display:flex;gap:10px;align-items:center;color:#eee;font-size:12.5px;font-weight:620}
.side-info-title svg{color:#bfbfbf}
.side-info p{margin:12px 0 18px;color:#a2a2a2;font-size:11.5px;line-height:1.75}
.version{font-size:9px;color:#888;letter-spacing:.18em;font-weight:560}
.spacer{flex:1;min-height:30px}
.side-bottom{margin:0 1px;border-top:1px solid #292929;display:flex;gap:12px;align-items:center;padding:23px 10px 5px}
.side-bottom strong{display:block;color:#dedede;font-size:11px;font-weight:625}
.side-bottom small{display:block;color:#858585;font-size:10px;margin-top:3px}
.online-dot{width:9px;height:9px;border-radius:50%;background:#eeeeee;box-shadow:0 0 0 5px #ffffff0e,0 0 12px #ffffff30;flex:none}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 34px;height:66px;min-height:66px;background:#090909;border-bottom:1px solid #262626}
.top-left,.top-right{display:flex;gap:17px;align-items:center;color:#aaa;font-size:12px}
.top-left svg{color:#777}
.top-product{color:#f3f3f3;font-weight:700;letter-spacing:.14em;font-size:11px}
.local-tag{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid #303030;border-radius:99px;background:#141414;color:#b4b4b4;letter-spacing:.11em;font-size:9px;font-weight:700}
.local-tag svg{color:#dedede}
.settings-button{width:36px;height:36px;display:grid;place-items:center;color:#d2d2d2;background:linear-gradient(150deg,#262626,#141414);border:1px solid #444;border-radius:11px;transition:border-color .18s,background .18s}
.settings-button:hover{background:#303030;border-color:#777}
.scroll-area{overflow-y:auto;overflow-x:hidden;flex:1;padding:35px 34px 58px;background:radial-gradient(ellipse 72% 55% at 72% -22%,#22222250,transparent 76%),#000;scrollbar-color:#4b4b4b #0a0a0a;scrollbar-width:thin}
.page{display:none;max-width:1600px;margin:0 auto}

.heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:0 0 25px}
h1{font-size:29px;font-weight:630;line-height:1.22;letter-spacing:-.045em;margin:8px 0 6px;color:#fff}

.card{background:linear-gradient(159deg,#1a1a1a 0%,#131313 50%,#111111 100%);border:1px solid #343434;border-radius:18px;box-shadow:inset 0 1px 0 #ffffff0d,0 9px 20px #0004}
.hero{min-height:218px;display:flex;justify-content:space-between;align-items:stretch;gap:24px;position:relative;overflow:hidden;padding:31px 32px;margin:0 0 28px;border-radius:29px;background:linear-gradient(109deg,#262626 0%,#151515 43%,#242424 74%,#0c0c0c 100%);border-color:#4a4a4a;box-shadow:inset 0 1px 0 #ffffff28,0 12px 45px #000b}

.hero-arc{position:absolute;pointer-events:none;left:33%;top:-250px;width:740px;height:600px;border:1px solid #ffffff1a;border-radius:50%;transform:rotate(-22deg);box-shadow:0 0 0 29px #ffffff04,0 0 0 58px #ffffff03,0 0 65px 28px #ffffff09,inset 0 0 60px #ffffff04;opacity:.76}
.hero-info{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column}
.hero-top{display:flex;align-items:center;gap:25px}
.hero-os{font-size:10.5px;display:flex;gap:7px;align-items:center;color:#a9a9a9}
.hero h2{font-weight:670;font-size:29px;line-height:1.22;letter-spacing:-.047em;margin:16px 0 5px;color:#f9f9f9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:780px}
.hero p{font-size:12px;color:#b7b7b7;margin:2px 0 23px;line-height:1.6;max-width:760px}
.hero-chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto}
.hero-chips span{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:8px;border:1px solid #454545;background:#141414a8;color:#dedede;font-size:10.5px;font-weight:560}
.hero-chips svg{color:#bdbdbd}
.hero-status{z-index:1;min-width:202px;flex:0 0 202px;border-left:1px solid #ffffff24;display:flex;align-items:center;justify-content:center;flex-direction:column;padding-left:28px}
.health-ring{width:108px;height:108px;position:relative}
.health-ring svg{filter:drop-shadow(0 0 8px #ffffff0c)}
.health-ring>div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.health-ring strong{font-size:12.5px;color:#f4f4f4;font-weight:690;letter-spacing:-.02em}
.health-ring small{margin-top:4px;font-size:7px;color:#a7a7a7;letter-spacing:.13em}
.status-caption{text-align:center;color:#bfbfbf;font-size:10px;margin-top:10px}
.status-caption small{display:block;color:#888;margin-top:4px;font-size:9.5px}
.section-row{margin:17px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.section-row h2{color:#f6f6f6;font-size:21px;line-height:1.2;letter-spacing:-.035em;margin:0;font-weight:630}
.section-row p{color:#919191;font-size:11.5px;margin:6px 0 0}
.section-meta{font-size:9.5px;color:#a1a1a1;letter-spacing:.1em;font-weight:680;white-space:nowrap;border:1px solid #353535;background:#111;border-radius:99px;padding:8px 12px}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.metric{position:relative;min-width:0;min-height:188px;padding:18px 19px 13px;overflow:hidden;border-radius:18px;background:linear-gradient(150deg,#1c1c1c 0%,#151515 57%,#101010 100%);border-color:#373737;transition:background .18s,border-color .18s,box-shadow .18s,transform .18s}
.metric:before{content:'';position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,#ffffff2d,transparent)}
.metric:hover{border-color:#696969;transform:translateY(-1px);background:linear-gradient(145deg,#252525,#161616);box-shadow:inset 0 1px 0 #ffffff12,0 10px 28px #0008}
.metric-head{display:flex;align-items:center;gap:10px;min-width:0}
.metric-icon{width:32px;height:32px;display:grid;place-items:center;border:1px solid #3c3c3c;background:linear-gradient(135deg,#333,#242424);color:#e3e3e3;border-radius:10px}
.metric-icon svg{width:17px;height:17px}
.metric-name{font-size:9px;white-space:nowrap;letter-spacing:.11em;color:#b8b8b8;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.metric-extra{margin-left:auto;color:#aaa;font-size:9px;border:1px solid #4a4a4a;border-radius:5px;padding:2px 6px}

.metric-value>span{font-size:14px;color:#bebebe;font-weight:550;letter-spacing:0;margin-left:4px}
.metric-sub{font-size:10.5px;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#989898}
.sp{width:100%;height:37px;margin-top:10px;display:block}
.bottom-grid{margin-top:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.detail-card{padding:22px 24px 17px;border-radius:18px}
.card-title{display:flex;gap:11px;align-items:center;font-size:13px;color:#f2f2f2;font-weight:640;margin-bottom:11px}

.detail-line{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding:12px 0;border-top:1px solid #2e2e2e;font-size:11px}

.detail-line strong{color:#dcdcdc;font-weight:570;max-width:68%;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.sensor-alert,.notice,.driver-banner{border:1px solid #494949;border-left:3px solid #a0a0a0;background:linear-gradient(110deg,#1e1e1e,#111);color:#cfcfcf;border-radius:13px;padding:15px 18px;margin:0 0 22px;box-shadow:inset 0 1px 0 #ffffff09}
.sensor-alert{display:flex;align-items:flex-start;gap:12px}
.sensor-alert svg,.notice svg{color:#ccc;flex:none;margin-top:2px}
.sensor-alert strong{font-size:10px;letter-spacing:.12em;color:#eee}
.sensor-alert p{font-size:11.5px;color:#c2c2c2;line-height:1.6;margin:6px 0}
.sensor-alert small{font-size:10px;color:#929292}
.notice{display:flex;align-items:flex-start;gap:10px;font-size:11px}
.notice b{color:#fff}
.driver-banner{display:flex;gap:17px;align-items:center}
.driver-symbol{border-radius:10px;border:1px solid #484848;padding:11px;background:#252525;color:#eee;line-height:0}
.driver-copy{flex:1;min-width:0}
.driver-copy strong{font-size:10px;letter-spacing:.12em;color:#eee}
.driver-copy p{font-size:11.5px;color:#c3c3c3;margin:6px 0}
.driver-copy small{color:#999;font-size:10px}
.driver-btn{white-space:nowrap;border-radius:10px;background:linear-gradient(140deg,#ededed,#b0b0b0);color:#080808!important;border:1px solid #eee;padding:11px 15px;font-size:11px}
.driver-result{font-size:10px;padding:10px;border-radius:7px;border:1px solid #555;background:#222;color:#ddd!important}
.driver-result.error,.driver-result.ok{color:#fff!important;border-color:#777}
.sensor-head{background:linear-gradient(135deg,#222,#151515);border-radius:19px;padding:21px 24px}
.sensor-icon,.sensor-icon.good{border:1px solid #505050;color:#e9e9e9;background:#2a2a2a;border-radius:12px}
.sensor-head h2{font-size:14px}
.sensor-head p{color:#aaa}
.sensor-table{overflow:hidden;border-radius:15px}

.sensor-row{border-top:1px solid #2a2a2a}

.sensor-row b{color:#e8e8e8}
.sensor-row small,.sensor-kind{color:#aaa}
.sensor-value,.sensor-value.invalid{color:#fff}
.raw-issue{font-size:9px;color:#aaa;letter-spacing:.08em}
.sensor-toolbar{display:flex;gap:12px}
input[type=text],select,.search input{background:#101010;color:#fff;border:1px solid #414141;border-radius:11px;padding:11px 13px;min-width:0}
input[type=text]:focus,select:focus,.search input:focus{border-color:#aaa}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid #494949;background:linear-gradient(180deg,#282828,#1b1b1b);color:#ddd;padding:10px 14px;transition:background .17s,border-color .17s;font-weight:650}

.lbl{color:#b5b5b5}
.row2{color:#ddd}

.b{border-color:currentColor}
.PASS{color:#e4e4e4}
.WARN{color:#a9a9a9}
.FAIL{color:#f6f6f6}
.INFO{color:#c8c8c8}
.SKIP{color:#888}

.toast{border:1px solid #777;color:#f1f1f1;background:#242424;border-radius:12px}

.export-result{border:1px solid #474747;background:#171717;color:#ddd;border-radius:10px}
.settings-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:#000b;backdrop-filter:blur(6px)}
.settings-dialog{width:min(95vw,515px);border:1px solid #585858;border-radius:21px;background:linear-gradient(148deg,#242424,#121212 75%);box-shadow:0 32px 110px #000,inset 0 1px 0 #ffffff29;padding:26px}

.settings-description{flex:1}
.settings-description strong{font-weight:630;font-size:13px;color:#eee}
.settings-description small{font-size:11px;line-height:1.55;margin-top:4px;display:block;color:#9b9b9b;max-width:310px}
.interval-options{display:flex;gap:5px;padding:4px;border:1px solid #383838;border-radius:11px;background:#111}

.interval-options button.selected{background:#3d3d3d;color:#fff;box-shadow:inset 0 1px 0 #ffffff24}

.toggle span{display:block;width:100%;height:100%;border-radius:99px;background:#303030;border:1px solid #555;transition:background .15s}
.toggle span:after{content:'';display:block;width:17px;height:17px;border-radius:50%;background:#aaa;position:absolute;top:4px;left:4px;transition:transform .15s,background .15s}
.toggle input:checked+span{background:#595959;border-color:#a3a3a3}

.settings-footer{border-top:1px solid #333;padding-top:16px;color:#999;font-size:10.5px;display:flex;align-items:center;gap:9px}
.reduce-motion *,.reduce-motion *:before,.reduce-motion *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.temp-source{display:flex;gap:20px;align-items:center;padding:16px 20px;margin:0 0 16px;border-left:3px solid #ffa876!important}
.temp-source-value{display:flex;align-items:baseline;gap:4px;color:#ffa876;min-width:128px}
.temp-source-value svg{align-self:center;margin-right:6px}
.temp-source-value strong{font-size:34px;letter-spacing:-.04em;color:#fff}
.temp-source-value span{color:#ffa876;font-weight:700}
.temp-source-copy b{font-size:12px;letter-spacing:.04em}
.temp-source-copy p{margin:3px 0 5px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.temp-source-copy small{display:block;color:var(--dim);font-size:10.5px;line-height:1.6}
.sensor-row.in-use{background:var(--a-soft)!important;box-shadow:inset 3px 0 0 var(--a1)}
.in-use-tag{font-style:normal;margin-left:9px;font-size:8.5px;letter-spacing:.1em;font-weight:800;padding:2px 6px;border-radius:5px;color:#04101e;background:linear-gradient(135deg,var(--a1),var(--a2))}
.temp-modes{flex-wrap:wrap}
.optimizer-page .section-row{margin-top:26px}
.opt-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:6px}
.opt-stat{display:flex;align-items:center;gap:14px;padding:16px 18px}
.opt-stat strong{display:block;font-size:21px;letter-spacing:-.03em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.opt-stat small{color:var(--muted);font-size:11px}
.opt-stat-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;border:1px solid}
.opt-stat-icon.ok{color:var(--ok);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4)}
.opt-stat-icon.warn{color:var(--warn);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.4)}
.opt-stat-icon.info{color:var(--info);background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.4)}
.opt-stat-icon.violet{color:var(--violet);background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.4)}
.plan-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.plan-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 18px;text-align:left;color:#dbe4f3;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s}
.plan-card svg{color:var(--a-ink);margin-bottom:6px}
.plan-card strong{font-size:13.5px}
.plan-card small{color:var(--muted);font-size:11px}
.plan-card:hover:not(:disabled){border-color:var(--a-line);transform:translateY(-2px)}
.plan-card.on{border-color:var(--a2)!important;box-shadow:0 0 0 1px var(--a-line),0 10px 30px var(--a-glow)}
.plan-card.on em{position:absolute;top:13px;right:13px;font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.1em;color:#04101e;background:linear-gradient(135deg,var(--a1),var(--a2));padding:3px 7px;border-radius:5px}
.plan-card:disabled{opacity:.55;cursor:not-allowed}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:13px}
.opt-card{padding:17px 19px;display:flex;flex-direction:column;gap:8px;border-left:3px solid transparent}
.opt-card.attention{border-left-color:var(--warn)}
.opt-card.optimal{border-left-color:var(--ok)}
.opt-card-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.opt-card-top strong{font-size:13.5px;margin-right:10px}
.opt-card p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.65;flex:1}
.opt-state{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:6px;border:1px solid}
.opt-state.on{color:#6ee7b7;background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4)}
.opt-state.off{color:#fca5a5;background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.38)}
.opt-state.unknown{color:#9aa5b8;background:rgba(123,132,148,.1);border-color:rgba(123,132,148,.3)}
.opt-card.attention .opt-state.on{color:#fcd34d;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.4)}
.opt-card.optimal .opt-state.off{color:#6ee7b7;background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4)}
.opt-tags{display:flex;gap:6px;flex-wrap:wrap;min-height:20px}
.tag{font-size:8.5px;font-weight:800;letter-spacing:.09em;padding:3px 7px;border-radius:5px;color:#9aa5b8;border:1px solid #2a3550;background:#0f1624;font-style:normal}
.tag.ok{color:#6ee7b7;border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.tag.warn{color:#fcd34d;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.tag.caution{color:#fdba74;border-color:rgba(251,146,60,.4);background:rgba(251,146,60,.1)}
.opt-card.action .btn{flex:none}
.opt-console{padding:18px 20px;margin-top:22px;border-top:2px solid var(--a1)}
.opt-console-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.opt-console-head h2{margin:2px 0 0;font-size:15px}
.opt-console .diag-progress-rail{margin-bottom:12px}
.diag-progress-rail i.indeterminate{width:35%!important;animation:slideBar 1.3s ease-in-out infinite}
@keyframes slideBar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
#app.reduce-motion .diag-progress-rail i.indeterminate{animation:none}
.opt-result{margin:0 0 12px;padding:10px 12px;border-radius:8px;font-size:12px;border:1px solid;overflow-wrap:anywhere}
.opt-result.ok{color:#a7f3d0;background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.35)}
.opt-result.bad{color:#fecaca;background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.38)}
.opt-console-body{max-height:230px;overflow:auto;background:#060910;border:1px solid #1d2638;border-radius:8px;padding:11px 13px;font:11px/1.65 Consolas,"Cascadia Mono",monospace;color:#aab6cc;white-space:pre-wrap;overflow-wrap:anywhere}
.startup-list,.history-list{padding:6px 0;overflow:hidden}
.startup-row,.history-row{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid #1a2233}
.startup-row:last-child,.history-row:last-child{border-bottom:0}
.startup-row:hover{background:var(--a-soft)}
.startup-row>div,.history-row>div{flex:1;min-width:0}
.startup-row b,.history-row b{display:block;font-size:12.5px}
.startup-row small,.history-row small{display:block;color:var(--dim);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-row time{color:var(--dim);font-size:10.5px;flex:none}
.history-row .dot{width:8px;height:8px;border-radius:50%;flex:none}

.dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}

.opt-card:not(.attention):not(.optimal) .opt-state.on{color:#93c5fd;background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.35)}

.startup-remove,.startup-restore{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:650;
  border:1px solid rgba(248,113,113,.38);background:rgba(248,113,113,.08);color:#fca5a5;transition:background .15s,border-color .15s,color .15s}
.startup-remove:hover:not(:disabled){background:rgba(248,113,113,.20);border-color:rgba(248,113,113,.7);color:#fff}

.startup-restore:hover{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.7);color:#fff}
.removed-box{margin-top:12px}
.removed-toggle{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:6px 2px;color:var(--muted,#9aa5b8);font-size:12px;font-weight:650}
.removed-toggle:hover{color:#fff}
.removed-toggle svg{transition:transform .15s}
.removed-toggle svg.open{transform:rotate(90deg)}
.removed-box .startup-list{margin-top:6px}
.theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}

/* ==========================================================================
   Pulse v5 - refinement layer (loads after base.css + derived light styles)
   Goal: a calm, native-feeling desktop tool instead of a glowing "AI dashboard".
     * flat surfaces, 1px borders, one radius scale, no glow / gradient text
     * sentence-case labels, tabular numbers, compact density
     * every colour comes from --c-* tokens that each theme defines (themes.css)
   ========================================================================== */
#app{--r:10px;--r-lg:12px;
  font-family:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;
  font-size:13px;color:var(--c-text);font-variant-numeric:tabular-nums}
#app[data-theme]{
  --bg:var(--c-bg);--side:var(--c-side);--panel:var(--c-surface);--panel2:var(--c-surface2);
  --line:var(--c-border);--line-soft:var(--c-border-soft);--txt:var(--c-text);--muted:var(--c-text2);--dim:var(--c-text3);
  --acc:var(--c-accent);--a1:var(--c-accent);--a2:var(--c-accent2);--a-ink:var(--c-accent-ink);
  --a-soft:var(--c-accent-soft);--a-line:var(--c-accent-line);--a-glow:transparent;
  --diag-line:var(--c-border);--diag-surface:var(--c-surface2);--theme-accent:var(--c-accent);--chart-grid:var(--c-grid);
  --box-line:var(--c-border);--box-bg:var(--c-surface2);
  background:var(--c-bg);color:var(--c-text);border:1px solid var(--c-border)!important;border-radius:14px!important}
#app[data-theme] *{letter-spacing:0!important;text-transform:none!important;text-shadow:none!important}
#app[data-theme] ::-webkit-scrollbar{width:10px;height:10px}
#app[data-theme] ::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
#app[data-theme] ::-webkit-scrollbar-thumb:hover{background:var(--c-text3);background-clip:padding-box;border:2px solid transparent}

/* ---- shell ---- */
#app[data-theme] .side{width:216px;flex:0 0 216px;padding:18px 10px 12px;gap:2px;background:var(--c-side);border-right:1px solid var(--c-border)}
#app[data-theme] .brand{padding:2px 10px 18px}
#app[data-theme] .brand strong{display:block;font-size:17px;font-weight:650;color:var(--c-text);line-height:1.1}
#app[data-theme] .brand small{display:block;font-size:11.5px;color:var(--c-text3);font-weight:400;margin-top:2px}
#app[data-theme] .nav button{height:36px;padding:0 10px;gap:10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--c-text2);font-size:13px;font-weight:500;box-shadow:none;transform:none}
#app[data-theme] .nav button:before{display:none!important}
#app[data-theme] .nav button svg{color:var(--c-text3);width:17px;height:17px}
#app[data-theme] .nav button:hover{background:var(--c-hover);color:var(--c-text)}
#app[data-theme] .nav button.on{background:var(--c-accent-soft);border-color:transparent;color:var(--c-text);font-weight:600}
#app[data-theme] .nav button.on>svg{color:var(--c-accent-ink)}
#app[data-theme] .side-bottom{padding:10px;border-top:1px solid var(--c-border);margin:0 -10px;padding-left:20px}
#app[data-theme] .side-bottom strong{font-size:12px;font-weight:600;color:var(--c-text)}
#app[data-theme] .side-bottom small{font-size:11px;color:var(--c-text3)}
#app[data-theme] .online-dot{width:7px;height:7px;box-shadow:none;background:var(--ok)}
#app[data-theme] .online-dot.offline{background:var(--c-text3)}
#app[data-theme] .topbar{height:46px;min-height:46px;padding:0 12px 0 22px!important;background:var(--c-top);border-bottom:1px solid var(--c-border)}
#app[data-theme] .top-title{font-size:13px;font-weight:600;color:var(--c-text)}
#app[data-theme] .local-tag{border:0;background:transparent;padding:0;color:var(--c-text3);font-size:11.5px;font-weight:500;gap:5px}
#app[data-theme] .local-tag svg{color:var(--c-text3)}
#app[data-theme] .settings-button{width:30px;height:30px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-surface2);color:var(--c-text2);display:grid;place-items:center;padding:0}
#app[data-theme] .settings-button:hover{color:var(--c-text);border-color:var(--c-border-strong)}
#app[data-theme] .win-controls{margin-left:6px;gap:4px;padding:0;border:0;border-radius:0;background:none;box-shadow:none}
#app[data-theme] .win-controls .win-btn{width:30px;height:30px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;color:var(--c-text2)}
#app[data-theme] .win-controls .win-btn:hover{background:none;border:0;color:var(--c-text)}
#app[data-theme] .win-controls .win-btn.close:hover{background:none;border:0;color:#e5384a}
#app[data-theme] .win-controls .win-sep{display:none}
#app[data-theme] .scroll-area{padding:18px 24px 32px;background:var(--c-bg)}
#app[data-theme] .page{max-width:1500px}

/* ---- headings: plain, no gradient text, no eyebrow labels ---- */
#app[data-theme] .eyebrow{display:none}
#app[data-theme] .heading{margin:0 0 14px;align-items:center}
#app[data-theme] h1,#app[data-theme] h1{font-size:21px;font-weight:650;line-height:1.2;margin:0;color:var(--c-text);background:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-fill-color:currentColor}
#app[data-theme] .sub{margin:3px 0 0;font-size:12.5px;color:var(--c-text2)}
#app[data-theme] .section-row{margin:20px 0 10px;align-items:baseline}
#app[data-theme] .section-row h2{font-size:14px;font-weight:650;margin:0;color:var(--c-text)}
#app[data-theme] .section-row p{margin:2px 0 0;font-size:12px;color:var(--c-text2)}
#app[data-theme] .section-meta{border:0;background:transparent;padding:0;color:var(--c-text3);font-size:11.5px;font-weight:500}
#app[data-theme] .live-indicator,#app[data-theme] .live-indicator{border:0;background:transparent;padding:0;color:var(--c-text2);font-size:12px;font-weight:500;gap:7px}
#app[data-theme] .live-indicator small{color:var(--c-text3);font-size:11.5px}
#app[data-theme] .live-indicator i{width:7px;height:7px;box-shadow:none!important;animation:none!important}

/* ---- surfaces ---- */
#app[data-theme] .card,#app[data-theme] .card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:none}
#app[data-theme] .card-title{font-size:13px;font-weight:650;color:var(--c-text);margin-bottom:10px;gap:8px}
#app[data-theme] .card-title svg,#app[data-theme] .card-title svg{color:var(--c-text3)}
#app[data-theme] .metric,#app[data-theme] .metric{padding:14px 16px 12px;transform:none;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
#app[data-theme] .metric:before,#app[data-theme] .metric:before{display:none!important}
#app[data-theme] .metric:hover,#app[data-theme] .metric:hover{transform:none;border-color:var(--c-border-strong);background:var(--c-surface)}
#app[data-theme] .metric-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))!important;gap:12px}
#app[data-theme] .metric-head{gap:8px;margin-bottom:6px;min-height:20px}
#app[data-theme] .metric-icon,#app[data-theme] .metric-icon{width:auto;height:auto;border:0;background:transparent;color:var(--mc,var(--c-text3));padding:0;border-radius:0}
#app[data-theme] .metric-icon svg{width:16px;height:16px}
#app[data-theme] .metric-name{font-size:12.5px;font-weight:550;color:var(--c-text2)}
#app[data-theme] .metric-extra,#app[data-theme] .metric-extra{margin-left:auto;padding:1px 6px;border-radius:5px;border:1px solid var(--c-border);background:var(--c-surface2);color:var(--c-text3);font-size:10.5px;font-weight:600}
#app[data-theme] .metric-value,#app[data-theme] .metric-value{font-size:27px;font-weight:600;line-height:1.15;color:var(--c-text);text-shadow:none}
#app[data-theme] .metric-value span{font-size:13px;font-weight:500;color:var(--c-text3);margin-left:3px}
#app[data-theme] .metric-sub{font-size:11.5px;color:var(--c-text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app[data-theme] .sp{height:34px;margin-top:8px;filter:var(--chart-filter,none)}

/* ---- overview hero -> compact device strip ---- */
#app[data-theme] .hero,#app[data-theme] .hero{min-height:0;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--c-surface);border:1px solid var(--c-border);overflow:visible}
#app[data-theme] .hero-info h2{font-size:18px;font-weight:650;margin:2px 0 2px;color:var(--c-text)}
#app[data-theme] .hero-info p{margin:0;font-size:12.5px;color:var(--c-text2)}
#app[data-theme] .hero-top{margin:0 0 4px}
#app[data-theme] .hero-os{font-size:12px;color:var(--c-text3);gap:6px}
#app[data-theme] .hero-chips{margin-top:10px;gap:8px}
#app[data-theme] .hero-chips span,#app[data-theme] .hero-chips span{border-radius:7px;border:1px solid var(--c-border);background:var(--c-surface2);color:var(--c-text2);padding:4px 9px;font-size:12px;font-weight:500;box-shadow:none}
#app[data-theme] .hero-chips svg,#app[data-theme] .hero-chips svg{color:var(--c-text3)}
#app[data-theme] .hero-status{border-left:1px solid var(--c-border);padding-left:20px;min-width:190px;flex-basis:auto;text-align:left;align-items:flex-start}
#app[data-theme] .status-pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--c-text)}
#app[data-theme] .status-pill i{width:8px;height:8px;border-radius:50%;background:var(--c-text3)}
#app[data-theme] .status-pill.ok i{background:var(--ok)}#app[data-theme] .status-pill.warn i{background:var(--warn)}#app[data-theme] .status-pill.bad i{background:var(--bad)}
#app[data-theme] .status-caption{font-size:12px;color:var(--c-text2);margin-top:4px;text-align:left}
#app[data-theme] .status-caption small{display:block;color:var(--c-text3);font-size:11.5px}
#app[data-theme] .bottom-grid{gap:12px;margin-top:12px}
#app[data-theme] .detail-card{padding:16px 18px}
#app[data-theme] .detail-line{padding:8px 0;border-bottom:1px solid var(--c-border-soft);font-size:12.5px}
#app[data-theme] .detail-line:last-child{border-bottom:0}

#app[data-theme="sakura"] :is(.btn,.nav button,.interval-options,.tag,.settings-button){border-radius:999px}
#app[data-theme="sakura"] .nav button.on{background:linear-gradient(90deg,rgba(255,111,165,.22),rgba(190,160,255,.14))}
#app[data-theme="sakura"] .brand strong{color:var(--c-accent-ink)}
#app[data-theme="sakura"] .top-title:before{content:"✿ ";color:var(--c-accent)}

/* ---------- theme picker swatches ---------- */
#app[data-theme] .theme-swatch{background:var(--sw-bg,#222);border:1px solid rgba(128,128,128,.3)}
#app[data-theme] .theme-swatch i{border:1px solid var(--sw-line,rgba(255,255,255,.18));border-radius:4px;box-shadow:none;background:var(--sw-card,rgba(255,255,255,.08))}
#app[data-theme] .theme-swatch i:nth-child(2){background:var(--sw-acc,#4c8dff);border-color:transparent}
.theme-card.onyx{--sw-bg:#0e1116;--sw-card:#1b212a;--sw-acc:#4c8dff}
.theme-card.amoled{--sw-bg:#000;--sw-card:#161616;--sw-acc:#e8e8e8}
.theme-card.forest{--sw-bg:#0b110e;--sw-card:#1a261f;--sw-acc:#3ecf8e}
.theme-card.steel{--sw-bg:#101213;--sw-card:#22282a;--sw-acc:#2dd4bf}
.theme-card.glass{--sw-bg:radial-gradient(ellipse at 85% 0,#8b7cff88,transparent 65%),#0a0b14;--sw-card:rgba(255,255,255,.12);--sw-acc:#8b7cff;--sw-line:rgba(255,255,255,.3)}
.theme-card.crimson{--sw-bg:linear-gradient(118deg,transparent 0 46%,#ff2d42 46.5% 50%,transparent 50.5% 58%,#fff 58.5% 60%,transparent 60.5%),radial-gradient(ellipse at 90% 0,#ff2d4288,transparent 60%),#060606;--sw-card:rgba(255,255,255,.14);--sw-acc:#ff2d42;--sw-line:rgba(255,255,255,.35)}
.theme-card.daylight{--sw-bg:#f4f6f9;--sw-card:#fff;--sw-acc:#2563eb;--sw-line:#dde2ea}
.theme-card.latte{--sw-bg:#f3eee6;--sw-card:#fbf8f3;--sw-acc:#c2410c;--sw-line:#ded4c4}
.theme-card.tokyo{--sw-bg:linear-gradient(180deg,#050816,#16224d);--sw-card:rgba(30,60,140,.5);--sw-acc:#ff7a1a;--sw-line:rgba(90,150,255,.5)}
.theme-card.starlight{--sw-bg:linear-gradient(160deg,#1a0b2e,#3b1457);--sw-card:rgba(255,170,225,.22);--sw-acc:#ff7ec4;--sw-line:rgba(255,170,225,.45)}

/* ==========================================================================
   Pulse polish layer (loads LAST)
   1. Theme-switch flicker guard   2. Professional typography
   3. Settings / theme window redesign
   ========================================================================== */

/* ---------- 1. flicker guard ----------
   While data-switching is set (App.jsx sets it for the frames in which the theme
   swaps) nothing may animate, so every surface changes colour in the same frame. */
#app[data-switching],#app[data-switching] *,#app[data-switching] *::before,#app[data-switching] *::after{
  transition:none!important;transition-duration:0s!important;transition-delay:0s!important}
/* Replace the old catch-all transition (it animated gradients/shadows and desynced from text colour). */
#app .topbar,#app .side,#app .scroll-area,#app .card,#app .metric,#app .hero,#app .side-info,#app .nav button,#app .btn{
  transition:background-color .12s ease,border-color .12s ease,color .12s ease}
#app .metric:hover{transform:none}
/* Keep wallpaper / artwork layers on their own GPU layer so they are not re-decoded on theme change. */
#app::before,#app::after{transform:translateZ(0);backface-visibility:hidden}
#app{background-clip:padding-box}
html,body{background:transparent}

/* ---------- 2. typography ---------- */
#app,#app button,#app input,#app select,#app textarea{
  font-family:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
#app{font-size:13px;line-height:1.5;font-weight:400;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-kerning:normal;font-variant-numeric:tabular-nums lining-nums}
#app[data-theme] h1{font-size:22px;font-weight:600;line-height:1.25}
#app[data-theme] .section-row h2,#app[data-theme] .card-title{font-weight:600}
/* only three weights are used anywhere: 400 / 500 / 600 */
#app[data-theme] strong,#app[data-theme] b,#app[data-theme] .metric-value,#app[data-theme] .sensor-value,
#app[data-theme] .brand strong,#app[data-theme] .settings-heading h2{font-weight:600}
#app[data-theme] .metric-value{font-size:26px;letter-spacing:-.01em!important}
#app[data-theme] .metric-name,#app[data-theme] .nav button{font-weight:500}
#app[data-theme] .brand strong{font-size:16px;letter-spacing:.01em!important}
#app[data-theme] .brand small{font-size:11px}

/* ---------- 3. settings window ---------- */
#app[data-theme] .settings-backdrop{background:rgba(0,0,0,.5);padding:24px}
#app[data-theme] .settings-dialog{
  width:min(94vw,620px);max-height:min(90vh,760px);padding:0;overflow:hidden;display:flex;flex-direction:column;
  border-radius:12px;background:var(--c-surface-solid,var(--c-surface));
  border:1px solid var(--c-border-strong);box-shadow:var(--shadow-lg);backdrop-filter:none!important}
#app[data-theme] .settings-dialog.confirm-dialog{display:block;overflow:visible;padding:22px 24px;width:min(92vw,440px)}
#app[data-theme] .settings-heading{
  margin:0;padding:16px 20px 14px;border-bottom:1px solid var(--c-border-soft);align-items:center;flex:0 0 auto}
#app[data-theme] .settings-heading h2{font-size:16px;line-height:1.3;margin:0}
#app[data-theme] .settings-heading p{font-size:12px;margin:2px 0 0;color:var(--c-text3)}
#app[data-theme] .settings-close{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--c-text3)}
#app[data-theme] .settings-close:hover{background:var(--c-hover);color:var(--c-text)}

/* scrollable body = everything between header and footer */
#app[data-theme] .settings-dialog>.settings-theme-area,
#app[data-theme] .settings-dialog>.settings-group{flex:0 0 auto}
#app[data-theme] .settings-dialog{overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}
#app[data-theme] .settings-heading{position:sticky;top:0;z-index:2;background:var(--c-surface-solid,var(--c-surface))}
#app[data-theme] .settings-footer{
  position:sticky;bottom:0;margin:0;padding:11px 20px;border-top:1px solid var(--c-border-soft);
  background:var(--c-surface-solid,var(--c-surface));font-size:11.5px;color:var(--c-text3);display:flex;align-items:center;gap:8px}

#app[data-theme] .settings-theme-area,#app[data-theme] .settings-group{
  margin:0;padding:16px 20px;border-top:0;border-bottom:1px solid var(--c-border-soft)}
#app[data-theme] .settings-group{display:flex;align-items:center;justify-content:space-between;gap:24px}
#app[data-theme] .settings-theme-area .settings-description{margin-bottom:4px}
#app[data-theme] .settings-description strong{display:block;font-size:13px;font-weight:600;line-height:1.35}
#app[data-theme] .settings-description small{font-size:12px;line-height:1.5;max-width:340px;margin-top:2px;color:var(--c-text3)}
#app[data-theme] .settings-theme-area .settings-description small{max-width:none}

#app[data-theme] .theme-group{margin-top:16px}
#app[data-theme] .theme-group-title{font-size:12px;font-weight:600;color:var(--c-text2);margin:0 0 8px}
#app[data-theme] .theme-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px}
#app[data-theme] .theme-card{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:6px 6px 9px;
  border-radius:9px;border:1px solid var(--c-border);background:var(--c-surface2);box-shadow:none;text-align:left;cursor:pointer;
  transition:border-color .12s ease,background-color .12s ease}
#app[data-theme] .theme-card:hover{border-color:var(--c-border-strong);background:var(--c-hover)}
#app[data-theme] .theme-card:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
#app[data-theme] .theme-card.active{border-color:var(--c-accent);box-shadow:0 0 0 1px var(--c-accent);background:var(--c-surface2)}
#app[data-theme] .theme-card strong{font-size:12.5px;font-weight:600;margin:8px 4px 0;line-height:1.3;color:var(--c-text)}
#app[data-theme] .theme-card small{font-size:11.5px;margin:1px 4px 0;line-height:1.3;color:var(--c-text3)}
#app[data-theme] .theme-selected{display:none}

/* mini window preview inside each tile */
#app[data-theme] .theme-swatch{position:relative;display:block;width:100%;height:56px;border-radius:6px;overflow:hidden}
#app[data-theme] .theme-swatch i{position:absolute;box-shadow:none!important;border-radius:3px}
#app[data-theme] .theme-swatch i:nth-child(1){left:5px;top:5px;bottom:5px;width:22%;height:auto}
#app[data-theme] .theme-swatch i:nth-child(2){left:calc(22% + 11px);right:5px;top:5px;width:auto;height:14px}
#app[data-theme] .theme-swatch i:nth-child(3){left:calc(22% + 11px);right:38%;top:24px;bottom:5px;width:auto;height:auto}
#app[data-theme] .theme-check{
  position:absolute;right:5px;bottom:5px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
  background:var(--c-accent);color:var(--c-on-accent);opacity:0;transform:scale(.8);transition:none}
#app[data-theme] .theme-check svg{stroke-width:3}
#app[data-theme] .theme-card.active .theme-check{opacity:1;transform:none}

/* controls */
#app[data-theme] .interval-options{display:inline-flex;gap:2px;padding:2px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-surface2)}
#app[data-theme] .interval-options button{height:26px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:500}
#app[data-theme] .wall-actions .btn{height:30px}
#app[data-theme] .toggle{flex:0 0 auto}

@media(max-width:540px){
  #app[data-theme] .theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #app[data-theme] .settings-group{flex-wrap:wrap}}
